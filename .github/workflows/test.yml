name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installed-kotoba-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify timing kernel with released native Kotoba
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/kotoba-v0.6.22"
          cli_dir="$RUNNER_TEMP/kotoba-cli"
          mkdir -p "$release_dir" "$cli_dir"
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.6.22/kotoba-linux-amd64.tar.gz
          curl -L --fail --silent --show-error \
            -o "$release_dir/kotoba-linux-amd64.tar.gz.sha256" \
            https://github.com/kotoba-lang/kotoba/releases/download/v0.6.22/kotoba-linux-amd64.tar.gz.sha256
          (cd "$release_dir" && sha256sum -c kotoba-linux-amd64.tar.gz.sha256)
          tar -xzf "$release_dir/kotoba-linux-amd64.tar.gz" -C "$cli_dir"
          "$cli_dir/kotoba" compile kotoba/timing.kotoba --target web \
            --output "$RUNNER_TEMP/timing.mjs" --json
          grep -q 'kotoba.artifact/provenance' "$RUNNER_TEMP/timing.mjs.manifest.edn"
          node scripts/test-kotoba-timing.mjs "$RUNNER_TEMP/timing.mjs"
          if "$cli_dir/kotoba" compile kotoba/negative_eval.kotoba --target web \
            --output "$RUNNER_TEMP/forbidden.mjs" --json; then
            echo "expected forbidden eval to be rejected" >&2
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cljdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cljdeps-
      - name: Run tests
        run: clojure -M:test
      - name: Lint (clj-kondo)
        run: clojure -M:lint
